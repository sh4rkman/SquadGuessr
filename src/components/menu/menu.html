
<div id="menu">
    
    <h1 data-i18n="common:menu.gameMode"></h1>
    <div class="game-modes">
        <div class="mode-card" data-mode="classic">
            <div class="mode-icon">🎯</div>
            <div class="mode-name" data-i18n="common:menu.classic"></div>
            <div class="top-score" data-i18n="common:menu.topScore"><span id="classicScore">0</span></div>
        </div>
        <div class="mode-card" data-mode="mapFinder">
            <div class="mode-icon">🗺️</div>
            <div class="mode-name" data-i18n="common:menu.findMap"></div>
            <div class="top-score" data-i18n="common:menu.topScore"><span id="mapFinderScore">0</span></div>
        </div>
    </div>

    <div class="menu-actions">
        <button id="BUTTON_TIMER" data-i18n="common:menu.buttons.next"></button>
        <button id="BUTTON_MP" data-i18n="common:mp.play"></button>
    </div>

    <button id="BUTTON_SUBMIT" data-i18n="common:submit.open"></button>
    <div id="submitChoice" hidden>
        <button id="BUTTON_SUBMIT_GO" data-i18n="common:submit.choice.submit"></button>
        <button id="BUTTON_REVIEW_GO" data-i18n="common:submit.choice.review"></button>
    </div>
