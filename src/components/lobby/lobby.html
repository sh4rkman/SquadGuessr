<div id="lobby">


    <div id="mpEntry">
        <h1 data-i18n="common:mp.title"></h1>
        <div class="mp-resume" hidden>
            <span class="mp-resume-text"></span>
            <button class="mp-resume-join" data-i18n="common:mp.buttons.rejoin"></button>
            <button class="mp-resume-dismiss" data-i18n-title="common:mp.dismissResume" data-i18n-aria-label="common:mp.dismissResume">✕</button>
        </div>
        <input type="text" id="mpName" maxlength="20" autocomplete="off" data-i18n-placeholder="common:mp.namePlaceholder" />
        <button id="BUTTON_MP_CREATE" data-i18n="common:mp.buttons.create"></button>
        <div class="mp-divider" data-i18n="common:mp.orJoin"></div>
        <div class="mp-join">
            <input type="text" id="mpCode" maxlength="4" autocomplete="off" data-i18n-placeholder="common:mp.codePlaceholder" />
            <button id="BUTTON_MP_JOIN" data-i18n="common:mp.buttons.join"></button>
        </div>
        <p id="mpGameRunning" data-i18n="common:mp.gameRunning"></p>
        <button id="BUTTON_MP_WATCH" data-i18n="common:mp.buttons.watch"></button>
        <button id="BUTTON_MP_BACK" data-i18n="common:timer.buttons.back"></button>
    </div>

    <div id="mpRoom" hidden>
        <div class="mp-code">
            <span data-i18n="common:mp.code"></span>
            <strong id="mpRoomCode"></strong>
        </div>
        <canvas id="mpQr"></canvas>
        <div class="mp-links">
            <p>
                <a id="mpJoinUrl" target="_blank" rel="noopener"></a>
                <button id="BUTTON_MP_COPY_JOIN" class="mp-copy" data-i18n-title="common:mp.copyJoinLink"><svg><use href="../shared/share.svg#share"></use></svg></button>
            </p>
            <p id="mpWatchRow">
                <a id="mpWatchUrl" target="_blank" rel="noopener"></a>
                <button id="BUTTON_MP_COPY_WATCH" class="mp-copy" data-i18n-title="common:mp.copyWatchLink"><svg><use href="../shared/share.svg#share"></use></svg></button>
            </p>
        </div>
        <ul id="mpPlayers" class="mp-players"></ul>
        <p id="mpSettingsSummary" class="guest-only"></p>
        <div id="mpSettings" class="host-only">
            <label for="mpMode" data-i18n="common:menu.gameMode"></label>
            <select id="mpMode">
                <option value="classic" data-i18n="common:menu.classic"></option>
                <option value="mapFinder" data-i18n="common:menu.findMap"></option>
            </select>
            <label for="mpTimer" data-i18n="common:timer.timer"></label>
            <div class="mp-pair">
                <select id="mpTimer">
                    <option value="0" data-i18n="common:timer.chill"></option>
                    <option value="60" data-i18n="common:timer.timedOption"></option>
                    <option value="rush" data-i18n="common:timer.rush"></option>
                </select>
                <select id="mpRush" data-i18n-aria-label="common:timer.rush" hidden>
                    <option value="5">5 s</option>
                    <option value="10">10 s</option>
                    <option value="15" selected>15 s</option>
                    <option value="20">20 s</option>
                    <option value="25">25 s</option>
                    <option value="30">30 s</option>
                </select>
            </div>
            <label for="mpSpeedBonus" data-i18n="common:timer.speedBonus" data-i18n-title="common:timer.speedBonusHint" hidden></label>
            <select id="mpSpeedBonus" data-i18n-title="common:timer.speedBonusHint" hidden>
                <option value="0" data-i18n="common:mp.off"></option>
                <option value="1" data-i18n="common:mp.on"></option>
            </select>
            <label for="mpRounds" data-i18n="common:mp.settings.rounds"></label>
            <select id="mpRounds">
                <option value="3">3</option>
                <option value="5" selected>5</option>
                <option value="10">10</option>
            </select>
            <label for="mpNext" data-i18n="common:mp.settings.next" data-i18n-title="common:mp.settings.nextHint"></label>
            <div class="mp-pair" data-i18n-title="common:mp.settings.nextHint">
                <select id="mpNext">
                    <option value="0" data-i18n="common:mp.nextHost"></option>
                    <option value="auto" data-i18n="common:mp.nextAuto"></option>
                </select>
                <select id="mpNextDelay" data-i18n-aria-label="common:mp.settings.next" hidden>
                    <option value="5">5 s</option>
                    <option value="10">10 s</option>
                    <option value="15" selected>15 s</option>
                    <option value="20">20 s</option>
                    <option value="25">25 s</option>
                    <option value="30">30 s</option>
                </select>
            </div>
            <label for="mpKeepCode" data-i18n="common:mp.code" data-i18n-title="common:mp.settings.codeHint"></label>
            <select id="mpKeepCode" data-i18n-title="common:mp.settings.codeHint">
                <option value="0" data-i18n="common:mp.codeNew"></option>
                <option value="1" data-i18n="common:mp.codeKeep"></option>
            </select>
        </div>
        <p id="mpWaitingForHost" class="guest-only" data-i18n="common:mp.waitingForHost"></p>
        <p id="mpLobbyStatus" hidden></p>
        <div class="button-container">
            <button id="BUTTON_MP_LEAVE" data-i18n="common:mp.buttons.leave"></button>
            <button id="BUTTON_MP_READY" class="guest-only" aria-pressed="false" data-i18n="common:mp.buttons.ready"></button>
            <button id="BUTTON_MP_START" class="host-only" data-i18n="common:mp.buttons.start"></button>
            <button id="BUTTON_MP_CANCEL" class="host-only" data-i18n="common:mp.buttons.cancel" hidden></button>
        </div>
    </div>

</div>

<div id="mpBanner" data-i18n="common:mp.reconnecting" hidden></div>
